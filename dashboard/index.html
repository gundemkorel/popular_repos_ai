<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent watch</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-screen" id="login-screen" hidden>
  <form class="login-card" id="login-form">
    <p class="eyebrow">Agent watch</p>
    <h1>Choose your username</h1>
    <p class="login-copy">Use the same username on your Mac, phone, and other computers to sync favorites.</p>
    <label for="username-input">Username</label>
    <input class="search" id="username-input" name="username" type="text" maxlength="32" autocomplete="username" placeholder="korel" required>
    <p class="login-error" id="login-error" aria-live="polite"></p>
    <button class="primary-btn" type="submit">Continue</button>
    <p class="login-note">No password. Anyone who knows the username can use the same favorites list.</p>
  </form>
</div>

<header class="top">
<div class="wrap">
  <div class="top-row">
    <div>
      <h1>Agent watch</h1>
      <p class="meta" id="meta">Loading…</p>
    </div>
    <button class="user-button" id="user-button" type="button" title="Switch username">
      <span id="user-label">Choose username</span>
      <span class="sync-status" id="sync-status" data-state="local">Local only</span>
    </button>
  </div>
  <input class="search" id="search" type="search" placeholder="Search repos…" autocomplete="off" aria-label="Search repos">
</div>
</header>

<nav class="chips-bar" aria-label="Buckets">
<div class="wrap">
<div class="chips" id="chips"></div>
</div>
</nav>

<main class="wrap" id="content"></main>
<footer class="wrap foot">GitHub only · last 6 months · 5 per lane</footer>

<script src="sync-config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
