name: Agent GitHub watch digest

on:
  schedule:
    # Trigger daily at 00:00 UTC; the cadence gate below runs the digest on alternating UTC days.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Enforce 48-hour cadence
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: running now"
            exit 0
          fi

          # A normal cron expression such as */2 in day-of-month is not a true
          # 48-hour cadence across month boundaries. Use the UTC Unix-day index
          # instead: every even-numbered UTC day since 1970-01-01 is a run slot.
          day_index=$(( $(date -u +%s) / 86400 ))
          if [ $(( day_index % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "48-hour run slot"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Off day: skipping digest"
          fi

      - name: Set up Python
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect GitHub repos
        if: steps.cadence.outputs.run == 'true'
        run: python3 scripts/collect.py

      - name: Rank repos
        if: steps.cadence.outputs.run == 'true'
        run: python3 scripts/rank.py

      - name: Build dashboard
        if: steps.cadence.outputs.run == 'true'
        run: python3 scripts/build_dashboard.py

      - name: Commit and push outputs
        if: steps.cadence.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data dashboard logs digests
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: agent watch digest"
          git push
